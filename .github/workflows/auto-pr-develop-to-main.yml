name: Auto PR develop to main

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update-pr:
    name: Open or Update Release PR (develop -> main)
    runs-on: ubuntu-latest
    steps:
      - name: Create or update pull request develop -> main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'develop';
            const base = 'main';

            const title = '[release] develop -> main';
            const body = [
              '## PR de Release criada automaticamente — Tradutor Rápido',
              '',
              'Este PR de release foi criado automaticamente para promover as alterações da branch `develop` para `main` e gerar o pacote da extensão (`.zip` / `.xpi`).',
              '',
              '_Este PR foi aberto automaticamente pelo workflow de CI/CD._'
            ].join('\n');

            try {
              const existing = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${head}`,
                base,
                per_page: 1,
              });

              let prNumber;

              if (existing.data.length > 0) {
                const pr = existing.data[0];
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  title,
                  body,
                });
                prNumber = pr.number;
                core.info(`Updated existing PR #${prNumber}.`);
              } else {
                const created = await github.rest.pulls.create({
                  owner,
                  repo,
                  head,
                  base,
                  title,
                  body,
                  draft: false,
                });
                prNumber = created.data.number;
                core.info(`Created PR #${prNumber}.`);
              }

              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number: prNumber,
                  reviewers: [owner],
                });
                core.info(`Requested review from ${owner}.`);
              } catch (error) {
                core.warning(`Could not request reviewer automatically: ${error.message}`);
              }
            } catch (prError) {
              if (
                prError.status === 403 &&
                String(prError.message).includes('not permitted to create or approve pull requests')
              ) {
                const settingsUrl = `https://github.com/${owner}/${repo}/settings/actions`;
                await core.summary
                  .addHeading('Permissão necessária no GitHub Actions')
                  .addRaw(
                    `O GitHub bloqueou a criação automática do Pull Request porque a opção **"Allow GitHub Actions to create and approve pull requests"** está desativada nas configurações do repositório.\n\n` +
                    `### Como ativar:\n` +
                    `1. Acesse **[Settings → Actions → General](${settingsUrl})**\n` +
                    `2. Na seção **Workflow permissions**, selecione **Read and write permissions** e marque **Allow GitHub Actions to create and approve pull requests**\n` +
                    `3. Clique em **Save** e reexecute este workflow.`
                  )
                  .write();
                core.setFailed(
                  `Ative 'Allow GitHub Actions to create and approve pull requests' em: ${settingsUrl}`
                );
                return;
              }
              throw prError;
            }
