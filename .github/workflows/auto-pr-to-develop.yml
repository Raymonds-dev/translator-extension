name: Auto PR to develop

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  open-or-update-pr:
    name: Open or Update PR to develop
    runs-on: ubuntu-latest
    steps:
      - name: Create or update pull request to develop
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
          script: |
            const head = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'develop';

            const validPrefix = /^(feature|fix|refactor|chore|docs)\//;
            if (!validPrefix.test(head)) {
              core.info(`Branch ${head} ignored: does not match configured prefixes.`);
              return;
            }

            // Garante que a branch base 'develop' exista no repositório (cria a partir da branch padrão se necessário)
            try {
              await github.rest.repos.getBranch({ owner, repo, branch: base });
            } catch (branchError) {
              if (branchError.status === 404) {
                core.info(`Branch '${base}' não encontrada. Criando automaticamente a partir da branch padrão...`);
                const repoInfo = await github.rest.repos.get({ owner, repo });
                const defaultBranch = repoInfo.data.default_branch || 'main';
                const defaultBranchRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${defaultBranch}`,
                });
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${base}`,
                  sha: defaultBranchRef.data.object.sha,
                });
                core.info(`Branch '${base}' criada com sucesso a partir de '${defaultBranch}'.`);
              } else {
                throw branchError;
              }
            }

            const [type, ...nameParts] = head.split('/');
            const branchSummaryRaw = nameParts.join('/').replace(/[-_]+/g, ' ').trim();

            let latestCommitSubject = '';
            try {
              const latestCommit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: context.sha,
              });
              latestCommitSubject = latestCommit.data.commit.message.split('\n')[0].trim();
            } catch (error) {
              core.warning(`Could not fetch latest commit message from ${context.sha}: ${error.message}`);
              const payloadHeadMessage = context.payload?.head_commit?.message || '';
              latestCommitSubject = payloadHeadMessage.split('\n')[0].trim();
            }

            const summary = latestCommitSubject || branchSummaryRaw || head;
            const title = `[${type}] ${summary}`;

            const body = [
              '## PR criada automaticamente — Tradutor Rápido',
              '',
              `Este PR foi criado automaticamente a partir do commit \`${context.sha.slice(0, 7)}\` na branch \`${head}\`.`,
              latestCommitSubject ? `**Último commit:** \`${latestCommitSubject}\`` : null,
              '',
              '_Este PR foi aberto automaticamente pelo workflow de CI/CD._'
            ].filter(Boolean).join('\n');

            try {
              const existing = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${head}`,
                base,
                per_page: 1,
              });

              if (existing.data.length > 0) {
                const pr = existing.data[0];
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  title,
                  body,
                });
                core.info(`Updated existing PR #${pr.number}.`);
                return;
              }

              const created = await github.rest.pulls.create({
                owner,
                repo,
                head,
                base,
                title,
                body,
                draft: false,
              });

              core.info(`Created PR #${created.data.number}.`);
            } catch (prError) {
              if (
                prError.status === 403 &&
                String(prError.message).includes('not permitted to create or approve pull requests')
              ) {
                const settingsUrl = `https://github.com/${owner}/${repo}/settings/actions`;
                await core.summary
                  .addHeading('Permissão necessária no GitHub Actions')
                  .addRaw(
                    `O GitHub bloqueou a criação automática do Pull Request porque a opção **"Allow GitHub Actions to create and approve pull requests"** está desativada nas configurações do repositório.\n\n` +
                    `### Como ativar (leva 10 segundos):\n` +
                    `1. Acesse **[Settings → Actions → General](${settingsUrl})**\n` +
                    `2. Role até a seção **Workflow permissions**\n` +
                    `3. Selecione **Read and write permissions** e marque a caixa **Allow GitHub Actions to create and approve pull requests**\n` +
                    `4. Clique em **Save** e reexecute este workflow.`
                  )
                  .write();
                core.setFailed(
                  `Ative 'Allow GitHub Actions to create and approve pull requests' em: ${settingsUrl}`
                );
                return;
              }
              throw prError;
            }
